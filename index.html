<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luciole</title>
<style>
  :root { --bg:#cfe3ee; --fg:#2f2a22; --muted:#6b6355; --accent:#5f9e2f; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:"Trebuchet MS", ui-rounded, system-ui, sans-serif; overflow:hidden; }
  body { display:flex; flex-direction:column; align-items:center; padding:12px 16px 8px; gap:6px; }
  #hud { display:flex; flex-wrap:wrap; gap:8px 16px; width:min(760px,100%); justify-content:space-between; align-items:center; }
  #hud h1 { margin:0; font-size:22px; letter-spacing:.12em; color:#d9861a; text-shadow:0 2px 0 #fff, 0 4px 10px rgba(120,80,20,.25); }
  #hud div { text-align:center; }
  #hud span { color:var(--muted); font-size:11px; letter-spacing:.15em; font-weight:bold; }
  #hud b { display:block; font-size:20px; }
  #lives { color:#d81b2c; letter-spacing:3px; font-size:22px; }
  #hurt { position:absolute; inset:0; pointer-events:none; opacity:0;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(190,0,20,.75) 100%); }
  #ammo.empty { color:#c8102e; }
  #weaponBtn { background:#8a2a1e !important; box-shadow:0 3px 0 #5a1a12 !important; }
  #stage { position:relative; width:100%; flex:1; min-height:0; border-radius:14px; overflow:hidden; }
  #stage canvas.gl { display:block; width:100%; height:100%; touch-action:none; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    pointer-events:none; text-align:center; }
  #overlay .big { font-size:clamp(32px,7vw,64px); font-weight:900; color:#e8901f;
    text-shadow:0 3px 0 #fff, 0 6px 0 #b8640c, 0 10px 24px rgba(80,50,20,.35); animation:wob 1.2s ease-in-out infinite; }
  #overlay .small { margin-top:10px; font-size:16px; font-weight:bold; color:var(--fg); background:rgba(255,255,255,.8);
    padding:6px 14px; border-radius:999px; }
  @keyframes wob { 0%,100%{transform:scale(1,1)} 30%{transform:scale(1.08,.92)} 60%{transform:scale(.95,1.05)} }
  .pop { position:absolute; transform:translate(-50%,-50%); font-weight:900; font-size:18px; color:#fff;
    text-shadow:0 2px 0 #b8640c, 0 0 8px rgba(80,50,20,.5); pointer-events:none; }
  #minimap { position:absolute; right:12px; bottom:12px; width:min(180px,34vw); height:auto; aspect-ratio:1;
    border-radius:14px; background:rgba(255,255,255,.75); box-shadow:0 6px 20px rgba(40,30,20,.3);
    display:none; pointer-events:none; }
  #cross { position:absolute; left:50%; top:50%; width:22px; height:22px; transform:translate(-50%,-50%);
    display:none; pointer-events:none; }
  #cross::before, #cross::after { content:""; position:absolute; background:rgba(255,255,255,.9);
    box-shadow:0 0 2px rgba(0,0,0,.6); }
  #cross::before { left:10px; top:0; width:2px; height:22px; }
  #cross::after { top:10px; left:0; height:2px; width:22px; }
  #viewBtn, #weaponBtn { font:inherit; font-weight:bold; font-size:13px; color:#fff; background:#5f9e2f; border:0; border-radius:999px;
    padding:8px 14px; cursor:pointer; box-shadow:0 3px 0 #3f7019; }
  #viewBtn:active, #weaponBtn:active { transform:translateY(2px); box-shadow:0 1px 0 #3f7019; }
  .help { color:var(--muted); font-size:12px; text-align:center; }
</style>

<script>
// Rechargement auto en local : recharge la page quand index.html change
if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
  let stamp = null;
  setInterval(async () => {
    try {
      const r = await fetch(location.pathname, { method:'HEAD', cache:'no-store' });
      const m = r.headers.get('Last-Modified');
      if (stamp && m && m !== stamp) location.reload();
      stamp = m;
    } catch (e) {}
  }, 1000);
}
</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ================= Données =================
const MAP = [
  "#####################",
  "#.........#.........#",
  "#o###.###.#.###.###o#",
  "#...................#",
  "#.###.#.#####.#.###.#",
  "#.....#...#...#.....#",
  "#####.### # ###.#####",
  "    #.#       #.#    ",
  "#####.# ##-## #.#####",
  "     .  #GGG#  .     ",
  "#####.# ##### #.#####",
  "    #.#       #.#    ",
  "#####.# ##### #.#####",
  "#.........#.........#",
  "#.###.###.#.###.###.#",
  "#o..#.....P.....#..o#",
  "###.#.#.#####.#.#.###",
  "#.....#...#...#.....#",
  "#.#######.#.#######.#",
  "#...................#",
  "#####################",
];
const W = 21, H = 21, OX = (W-1)/2, OZ = (H-1)/2;
const DIRS = [{x:0,y:-1},{x:-1,y:0},{x:0,y:1},{x:1,y:0}];
const CORNERS = [{x:W-2,y:-2},{x:1,y:-2},{x:W-1,y:H+1},{x:0,y:H+1}];
const SCHEDULE = [7, 20, 7, 20, 5, Infinity];
const GAME_SPEED = 0.25;           // ralenti global du jeu
const ENEMY_COLORS = ['#c8102e', '#5b2a86', '#1f8fd6', '#f07c1a'];
const FRIGHT_COLOR = '#a9c3d6';
const WALL_H = 1.0;
const BULLET_SPEED = 16, START_AMMO = 6, CRATE_AMMO = 6, MAX_AMMO = 30;
const ROCKET_SPEED = 12, START_ROCKETS = 3, CRATE_ROCKETS = 2, MAX_ROCKETS = 9;
const TURN_SPEED = 2.6, PLAYER_R = 0.26, MAX_HEARTS = 3, INVULN = 2.5;
const WEAPONS = {
  rifle:   { name:'Fusil',        cd:0.30,  speed:16, recoil:1.0,  flash:0.07, max:30 },
  glock:   { name:'Double Glock', cd:0.13,  speed:15, recoil:0.6,  flash:0.05, max:120, drop:40 },
  minigun: { name:'Minigun',      cd:0.065, speed:18, recoil:0.35, flash:0.04, max:400, drop:150, spread:0.06 },
  bazooka: { name:'Bazooka',      cd:1.0,   speed:12, recoil:1.6,  flash:0.12, max:9,   drop:2, rocket:true },
  katana:  { name:'Katana',       cd:0.45,  recoil:0, flash:0, melee:true },
};
const WEAPON_ORDER = ['rifle', 'glock', 'minigun', 'bazooka', 'katana'];
const SLASH_TIME = 0.3, SLASH_RANGE = 1.35;
const DROP_TYPES = ['glock', 'minigun', 'bazooka'];

// Cases accessibles
const reach = (() => {
  const seen = new Set(['10,15']), q = [[10,15]];
  while (q.length) {
    const [x,y] = q.shift();
    for (const d of DIRS) {
      const nx = (x+d.x+W)%W, ny = y+d.y;
      if (ny<0 || ny>=H || MAP[ny][nx]==='#' || seen.has(nx+','+ny)) continue;
      seen.add(nx+','+ny); q.push([nx,ny]);
    }
  }
  return seen;
})();
const isReach = (x,y) => reach.has(x+','+y);

// Relief : collines dans les passages (coordonnées de la grille → hauteur)
const HILLS = [ // x, y, hauteur, largeur
  [3, 3, 0.8, 2.0], [17, 3, 0.65, 2.0], [10, 19, 0.85, 2.6], [4, 16, 0.55, 1.8],
  [16, 15, 0.7, 2.0], [10, 4.5, 0.5, 1.6], [1.5, 12, 0.45, 1.5], [18.5, 12, 0.45, 1.5], [7, 13, 0.35, 1.3],
];
function terrainH(gx, gy) {
  let h = 0;
  for (const [cx, cy, a, sg] of HILLS) h += a*Math.exp(-((gx-cx)**2 + (gy-cy)**2)/(sg*sg));
  h += 0.05*(1 + Math.sin(gx*0.9)*Math.cos(gy*0.7));                  // petites ondulations
  const hd = Math.hypot(gx-10, (gy-8.7)*1.2);                           // maison des monstres à plat
  h *= Math.min(1, Math.max(0, (hd-2.2)/1.5));
  const edge = Math.min(gx+1, W-gx, gy+1, H-gy);                        // rejoint la prairie au bord
  h *= Math.min(1, Math.max(0, edge/1.5));
  return h;
}

// ================= Three.js =================
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.domElement.className = 'gl';
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
stage.prepend(renderer.domElement);

const SKY = '#b9dcf2';
const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 40, 90);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 300);
scene.add(camera);
scene.add(new THREE.HemisphereLight('#dff0ff', '#4f6b2e', 0.9));
const sun = new THREE.DirectionalLight('#fff3dd', 2.4);
sun.position.set(-8, 24, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-16, right:16, top:16, bottom:-16, near:1, far:70 });
sun.shadow.bias = -0.0005;
sun.shadow.radius = 3;
scene.add(sun);

const uTime = { value:0 };
const M = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness:0.75, ...o });

// ---------- Textures procédurales ----------
function canvasTex(size, draw, repeat) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat); }
  return t;
}
const grassTex = canvasTex(512, (g, S) => {
  g.fillStyle = '#4c7a2c'; g.fillRect(0, 0, S, S);
  const greens = ['#5f9638', '#3f6b25', '#6fa845', '#46752a', '#7cb24e', '#36601f'];
  for (let i=0; i<9000; i++) {
    const x = Math.random()*S, y = Math.random()*S, l = 3 + Math.random()*9;
    g.strokeStyle = greens[i % greens.length]; g.globalAlpha = 0.5 + Math.random()*0.5;
    g.lineWidth = 0.8 + Math.random()*1.4;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + (Math.random()-0.5)*4, y - l); g.stroke();
  }
  g.globalAlpha = 1;
}, 70);
const pathTex = canvasTex(1024, (g, S) => {
  const ts = S/(W+2), c = (v) => (v+1.5)*ts;
  g.save();
  g.filter = 'blur(7px)';
  g.strokeStyle = '#8b6d47'; g.lineCap = 'round'; g.lineWidth = ts*0.78;
  g.beginPath();
  for (let y=0; y<H; y++) for (let x=0; x<W; x++) if (isReach(x,y)) {
    g.moveTo(c(x), c(y)); g.lineTo(c(x)+0.1, c(y));
    if (x+1 < W && isReach(x+1,y)) { g.moveTo(c(x), c(y)); g.lineTo(c(x+1), c(y)); }
    if (isReach(x,y+1)) { g.moveTo(c(x), c(y)); g.lineTo(c(x), c(y+1)); }
  }
  g.stroke();
  g.restore();
  // grain de la terre + cailloux
  g.globalCompositeOperation = 'source-atop';
  for (let i=0; i<14000; i++) {
    g.fillStyle = Math.random() < 0.5 ? 'rgba(70,50,30,.35)' : 'rgba(190,160,120,.3)';
    g.fillRect(Math.random()*S, Math.random()*S, 1.5, 1.5);
  }
  for (let i=0; i<700; i++) {
    const x = Math.random()*S, y = Math.random()*S, r = 1 + Math.random()*3;
    g.fillStyle = ['#9a8e7e', '#7d7266', '#b3a690', '#6a5a48'][i%4];
    g.beginPath(); g.ellipse(x, y, r, r*0.75, Math.random()*3, 0, Math.PI*2); g.fill();
  }
});

// ---------- Matériaux & vent ----------
const solidMat = (color, extra = {}) => new THREE.MeshPhysicalMaterial({
  color, roughness:0.5, clearcoat:0.25, clearcoatRoughness:0.5, sheen:0.4, sheenColor:'#ffffff', ...extra,
});
function windy(mat) {
  mat.onBeforeCompile = sh => {
    sh.uniforms.uTime = uTime;
    sh.vertexShader = 'uniform float uTime;\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
      vec3 ip = vec3(0.0);
      #ifdef USE_INSTANCING
        ip = instanceMatrix[3].xyz;
      #endif
      float sw = sin(uTime*1.8 + ip.x*0.5 + ip.z*0.35)*0.6 + sin(uTime*3.1 + ip.x*1.7)*0.25;
      transformed.x += sw*position.y*position.y*0.12;
      transformed.z += sw*position.y*position.y*0.06;`);
  };
  return mat;
}

// ---------- Sol, chemin, nature ----------
const ground = new THREE.Mesh(new THREE.PlaneGeometry(260, 260), new THREE.MeshStandardMaterial({ map:grassTex, roughness:0.95 }));
ground.rotation.x = -Math.PI/2; ground.position.y = -0.01; ground.receiveShadow = true; scene.add(ground);
function terrainGeo(lift) {
  const g = new THREE.PlaneGeometry(W+2, H+2, (W+2)*6, (H+2)*6);
  g.rotateX(-Math.PI/2);
  const pa = g.attributes.position;
  for (let i=0; i<pa.count; i++) pa.setY(i, terrainH(pa.getX(i)+OX, pa.getZ(i)+OZ) + lift);
  g.computeVertexNormals();
  return g;
}
const boardGrass = grassTex.clone(); boardGrass.repeat.set((W+2)/3.7, (H+2)/3.7); boardGrass.needsUpdate = true;
const terrain = new THREE.Mesh(terrainGeo(0), new THREE.MeshStandardMaterial({ map:boardGrass, roughness:0.95 }));
terrain.receiveShadow = true; scene.add(terrain);
const pathMesh = new THREE.Mesh(terrainGeo(0.012),
  new THREE.MeshStandardMaterial({ map:pathTex, transparent:true, roughness:1, depthWrite:false }));
pathMesh.receiveShadow = true; scene.add(pathMesh);

// Brins d'herbe (bords des couloirs + prairie autour)
{
  const blade = new THREE.BufferGeometry();
  blade.setAttribute('position', new THREE.Float32BufferAttribute([-0.018,0,0, 0.018,0,0, 0,1,0.01], 3));
  blade.computeVertexNormals();
  const pts = [];
  for (const k of reach) {
    const [x,y] = k.split(',').map(Number);
    for (let i=0; i<14; i++) {
      const a = Math.random()*Math.PI*2, r = 0.3 + Math.random()*0.2;
      pts.push([x + Math.cos(a)*r, y + Math.sin(a)*r, 0.08 + Math.random()*0.12]);
    }
  }
  for (let i=0; i<9000; i++) {
    const a = Math.random()*Math.PI*2, r = 12.5 + Math.random()*26;
    pts.push([OX + Math.cos(a)*r, OZ + Math.sin(a)*r, 0.12 + Math.random()*0.25]);
  }
  const grass = new THREE.InstancedMesh(blade, windy(M('#ffffff', { side:THREE.DoubleSide, roughness:0.9 })), pts.length);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), c = new THREE.Color(), sc = new THREE.Vector3(), ps = new THREE.Vector3();
  const tones = ['#5f9638', '#4c7f2c', '#78ad46', '#3f6b25', '#8cbf55'];
  pts.forEach(([x,y,h], i) => {
    q.setFromEuler(e.set((Math.random()-0.5)*0.3, Math.random()*Math.PI, (Math.random()-0.5)*0.3));
    m.compose(ps.set(x-OX, terrainH(x, y) - 0.01, y-OZ), q, sc.set(1, h, 1));
    grass.setMatrixAt(i, m); grass.setColorAt(i, c.set(tones[i % tones.length]));
  });
  scene.add(grass);
}
// Fleurs, rochers, arbres autour du labyrinthe
{
  const n = 260, fl = new THREE.InstancedMesh(new THREE.SphereGeometry(0.05, 8, 6), M('#ffffff', { roughness:0.6 }), n);
  const m = new THREE.Matrix4(), c = new THREE.Color(), cols = ['#ffffff', '#f3d34a', '#7aa7e0', '#f0f0d0'];
  for (let i=0; i<n; i++) {
    const a = Math.random()*Math.PI*2, r = 12.5 + Math.random()*22;
    m.makeTranslation(Math.cos(a)*r, 0.18 + Math.random()*0.1, Math.sin(a)*r);
    fl.setMatrixAt(i, m); fl.setColorAt(i, c.set(cols[i%4]));
  }
  scene.add(fl);
  const rockMat = M('#8f8a80', { roughness:0.9, flatShading:true });
  for (let i=0; i<26; i++) {
    const a = Math.random()*Math.PI*2, r = 12.5 + Math.random()*20, s = 0.2 + Math.random()*0.6;
    const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(s, 0), rockMat);
    rock.position.set(Math.cos(a)*r, s*0.35, Math.sin(a)*r);
    rock.rotation.set(Math.random()*3, Math.random()*3, Math.random()*3);
    rock.scale.y = 0.6; rock.castShadow = true; rock.receiveShadow = true; scene.add(rock);
  }
  const trunkMat = M('#6b4a2e', { roughness:0.9 }), leafMats = ['#3f7a2a', '#4f8a32', '#356b24'].map(c => M(c, { roughness:0.8, flatShading:true }));
  for (let i=0; i<34; i++) {
    const a = i/34*Math.PI*2 + Math.random()*0.15, r = 15 + Math.random()*18, s = 0.8 + Math.random()*0.8;
    const t = new THREE.Group(); t.position.set(Math.cos(a)*r, 0, Math.sin(a)*r);
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12*s, 0.18*s, 1.6*s, 8), trunkMat);
    trunk.position.y = 0.8*s; trunk.castShadow = true; t.add(trunk);
    for (let k=0; k<3; k++) {
      const leaf = new THREE.Mesh(new THREE.IcosahedronGeometry((0.9 - k*0.15)*s, 0), leafMats[(i+k)%3]);
      leaf.position.set((Math.random()-0.5)*0.5*s, (1.7 + k*0.55)*s, (Math.random()-0.5)*0.5*s);
      leaf.castShadow = true; t.add(leaf);
    }
    scene.add(t);
  }
}

// ---------- Murs en pierre ----------
const wallTiles = [];
for (let y=0; y<H; y++) for (let x=0; x<W; x++) {
  if (MAP[y][x]==='#' || (MAP[y][x]===' ' && !isReach(x,y))) wallTiles.push([x,y]);
}
function seeded(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function brickCanvas(bump) {
  const S = 512, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'), rnd = seeded(1234);
  g.fillStyle = bump ? '#1a1a1a' : '#5a534b'; g.fillRect(0, 0, S, S); // mortier
  const rows = 6, cols = 3, bh = S/rows, bw = S/cols, m = 8;
  const stones = ['#9c8f80', '#8a7d6e', '#a89a88', '#7f7366', '#958a7c', '#8f8576'];
  for (let r=0; r<rows; r++) {
    const off = r % 2 ? bw/2 : 0;
    for (let i=-1; i<=cols; i++) {
      const x = i*bw + off, y = r*bh, shade = rnd(), pick = stones[Math.floor(rnd()*stones.length)];
      if (bump) { const v = 190 + shade*50 | 0; g.fillStyle = `rgb(${v},${v},${v})`; }
      else g.fillStyle = pick;
      g.beginPath(); g.roundRect(x + m/2, y + m/2, bw - m, bh - m, 6); g.fill();
      for (let k=0; k<60; k++) { // usure de la pierre
        const px = x + m/2 + rnd()*(bw-m), py = y + m/2 + rnd()*(bh-m), sz = 1 + rnd()*4, v = rnd() < 0.5;
        g.fillStyle = bump ? (v ? 'rgba(255,255,255,.25)' : 'rgba(0,0,0,.35)') : (v ? 'rgba(255,255,255,.08)' : 'rgba(40,30,20,.15)');
        g.fillRect(px, py, sz, sz);
      }
      if (!bump) { // léger dégradé pour le volume
        const gr = g.createLinearGradient(0, y, 0, y + bh);
        gr.addColorStop(0, 'rgba(255,255,255,.08)'); gr.addColorStop(1, 'rgba(0,0,0,.12)');
        g.fillStyle = gr; g.fillRect(x + m/2, y + m/2, bw - m, bh - m);
      }
    }
  }
  if (!bump) { // mousse en bas du mur
    for (let k=0; k<500; k++) {
      const px = rnd()*S, py = S - Math.pow(rnd(), 2.2)*S*0.45, r = 2 + rnd()*7;

  }

    if (stateT > 2.4) { level++; resetGrid(); resetActors(); setState('ready'); }
    return;
  }
  if (state !== 'play') return;
  if (freezeT > 0) { freezeT -= dt; return; }
  dt *= GAME_SPEED;

  if (frightT > 0) {
    frightT -= dt;
    if (frightT <= 0) for (const e of enemies) if (e.mode === 'fright') e.mode = globalMode;
  } else {
    modeT += dt;

      for (const e of enemies) if (e.mode==='scatter'||e.mode==='chase') { e.mode = globalMode; reverse(e); }
    }

  for (const e of enemies) {
    if (e.mode === 'house') {

  if (crateT > 8) { crateT = 0; spawnCrate('ammo'); }
  if (rocketT > 12) { rocketT = 0; spawnCrate(DROP_TYPES[Math.random()*3|0]); }

  movePlayer(dt);

  collisions();

}

                    base.y + (moving ? Math.abs(Math.cos(player.walk*9.5))*0.012 : 0),
                    base.z + recoil*0.07);
    vm.rotation.x = -recoil*0.18;
    weaponFlash(vm, flashT > 0);
    if (weapon === 'katana') {
      const k = slashT > 0 ? 1 - slashT/SLASH_TIME : 0, sw = slashT > 0 ? Math.sin(k*Math.PI) : 0;
      vm.rotation.set(0.5 - sw*0.9, Math.PI + 0.25 - (slashT > 0 ? (k - 0.35)*2.6 : 0), 0.6 - sw*0.9);
      vm.position.x = base.x - (slashT > 0 ? k*0.32 : 0);
      vm.position.y = base.y + sw*0.06;
    }
  } else {
    for (const w of WEAPON_ORDER) VM[w].m.visible = false;
    camX += ((p.x-OX)*0.12 - camX)*Math.min(1, dt*3);
    camera.position.set(camX, topDist*0.86, topDist*0.52);
    camera.lookAt(0, 0, 0.6);
  }
  if (state === 'eaten' && eatK) {
    const T = stateT, v = monsterViews[eatK.slot], pp = playerPos(), kp = eatFrom;
    const ease = k => { k = Math.min(1, Math.max(0, k)); return k*k*(3-2*k); };
    let dx = pp.x - kp.x; if (Math.abs(dx) > W/2) dx -= Math.sign(dx)*W;
    const dy = pp.y - kp.y, len = Math.hypot(dx, dy) || 1;
    const ang = Math.atan2(dx, dy), ux = Math.sin(ang), uy = Math.cos(ang);
    const a1 = ease(T/0.7);
    // le monstre se jette sur le joueur et grossit
    const tx = pp.x - ux*0.5, ty = pp.y - uy*0.5;
    const mx = kp.x + (tx - kp.x)*a1, my = kp.y + (ty - kp.y)*a1;
    v.root.visible = true;
    const gh = terrainH(mx, my);
    v.root.position.set(mx-OX, gh, my-OZ); v.root.rotation.y = ang;
    v.root.scale.setScalar((eatK.kind === 3 ? 1.08 : 1) * (1 + 0.7*a1));
    const chewing = T > 1.5 && T < 3.0, chew = chewing ? Math.sin((T-1.5)*20) : 0;
    const open = T < 1.5 ? a1 : (chewing ? Math.max(0, chew) : 0);
    v.mouth.scale.set(0.15 + 0.08*open, 0.055 + 0.17*open, 0.04 + 0.03*open);
    const belly = T > 3.0 ? ease((T-3.0)/0.5)*0.15 : 0;
    v.body.scale.set(1 + Math.abs(chew)*0.07 + belly, 1 - Math.abs(chew)*0.09, 1 + Math.abs(chew)*0.07 + belly);
    v.arms.forEach((a, i) => { const s = i ? 1 : -1; a.rotation.set(T < 1.5 ? -1.6 - a1*0.3 : -2.9 + chew*0.35, 0, -s*(T < 1.5 ? 0.15 : 0.45)); });
    v.sign.rotation.z = chew*0.15;
    // le joueur est soulevé puis avalé
    v.root.updateMatrixWorld(true);
    v.mouth.getWorldPosition(_v);
    const a2 = ease((T-0.7)/0.8);
    hero.root.visible = a2 < 0.98;
    const ph0 = terrainH(pp.x, pp.y);
    hero.root.position.set(pp.x-OX + (_v.x - (pp.x-OX))*a2, ph0 + (_v.y - 0.35 - ph0)*a2 + Math.sin(a2*Math.PI)*0.4, pp.y-OZ + (_v.z - (pp.y-OZ))*a2);
    hero.root.scale.setScalar(1 - a2*0.92);
    hero.root.rotation.x = -a2*1.4; hero.root.rotation.y = ang + Math.PI + a2*6;
    hero.legs[0].rotation.x = Math.sin(time*30)*0.9*(a2 > 0 ? 1 : 0); hero.legs[1].rotation.x = -hero.legs[0].rotation.x;
    // bruitages
    if (eatSfx === 0 && T > 0.7) { eatSfx = 1; beep(520, 0.4, 'triangle', 0.08, 900); }
    if (eatSfx === 1 && T > 1.45) { eatSfx = 2; noiseHit(900, 120, 0.25, 0.4); beep(110, 0.25, 'square', 0.08, 50); }
    if (eatSfx >= 2 && eatSfx < 6 && T > 1.5 + (eatSfx-1)*0.32) { eatSfx++; noiseHit(700, 150, 0.12, 0.3); burst(mx + ux*0.3, my + uy*0.3, '#5b6b3a', 4, 0.6); }
    if (eatSfx === 6 && T > 3.1) { eatSfx = 7; beep(90, 0.7, 'sawtooth', 0.09, 55); }
    // caméra cinématique
    const px_ = -uy, py_ = ux;
    _v.set(mx-OX + ux*2.4 + px_*0.9, 1.3 + gh, my-OZ + uy*2.4 + py_*0.9);
    camCine.lerp(_v, Math.min(1, dt*2.5));
    camera.position.copy(camCine);
    camera.lookAt(mx-OX, 0.65 + gh, my-OZ);
    camera.fov += (50 - camera.fov)*Math.min(1, dt*3); camera.updateProjectionMatrix();
  }
  if (shakeT > 0) {
    const a = shakeT*(view === 'fp' ? 0.12 : 0.5);
    camera.position.x += (Math.random()-0.5)*a; camera.position.y += (Math.random()-0.5)*a; camera.position.z += (Math.random()-0.5)*a;
  }

  // Textes flottants
  const w = stage.clientWidth, h = stage.clientHeight;
  for (const pp of popups) {
    pp.t += dt;
    _v.set(pp.x, 1 + pp.h + pp.t*1.5, pp.z).project(camera);
    pp.el.style.left = (_v.x*0.5+0.5)*w + 'px';
    pp.el.style.top = (-_v.y*0.5+0.5)*h + 'px';
    pp.el.style.opacity = _v.z > 1 ? 0 : 1 - pp.t;
  }
  popups = popups.filter(pp => { if (pp.t < 1) return true; pp.el.remove(); return false; });

  renderer.render(scene, camera);
  if (view === 'fp') drawMinimap(time);
}

// ---------- Minimap ----------
const mm = document.getElementById('minimap'), mctx = mm.getContext('2d');
const MS = 9, MPAD = 6, MDPR = Math.min(2, devicePixelRatio || 1), MW = W*MS + MPAD*2;
mm.width = mm.height = MW * MDPR;
mctx.scale(MDPR, MDPR);
const mmBase = document.createElement('canvas');
mmBase.width = mmBase.height = MW * MDPR;
{
  const g = mmBase.getContext('2d'); g.scale(MDPR, MDPR);
  g.fillStyle = '#7fae55'; g.beginPath(); g.roundRect(0, 0, MW, MW, 10); g.fill();
  for (const k of reach) {
    const [x,y] = k.split(',').map(Number), hh = terrainH(x, y);
    g.fillStyle = `hsl(32, ${28 - hh*8}%, ${44 + hh*30}%)`; g.fillRect(MPAD + x*MS, MPAD + y*MS, MS, MS);
  }
  g.fillStyle = '#e8a317'; g.fillRect(MPAD + 10*MS + 1, MPAD + 8*MS + MS/2 - 1, MS-2, 2);
}
function drawMinimap(time) {
  mctx.clearRect(0, 0, MW, MW);
  mctx.drawImage(mmBase, 0, 0, MW, MW);
  const cx = x => MPAD + x*MS + MS/2, cy = y => MPAD + y*MS + MS/2;
  for (let y=0; y<H; y++) for (let x=0; x<W; x++) {
    const c = grid[y][x];
    if (c === '#') { mctx.fillStyle = (x+y) % 2 ? '#9c8f80' : '#8f8576'; mctx.beginPath(); mctx.roundRect(MPAD + x*MS + 0.5, MPAD + y*MS + 0.5, MS-1, MS-1, 2.5); mctx.fill(); }
  }
  for (const k of destroyed) { const [x,y] = k.split(',').map(Number); mctx.fillStyle = '#a08a70'; mctx.fillRect(MPAD + x*MS, MPAD + y*MS, MS, MS); }
  for (let y=0; y<H; y++) for (let x=0; x<W; x++) {
    const c = grid[y][x];
    if (c === '.') { mctx.fillStyle = '#f6e7b0'; mctx.fillRect(cx(x)-1, cy(y)-1, 2, 2); }
    else if (c === 'o') { mctx.fillStyle = '#d81b2c'; mctx.beginPath(); mctx.arc(cx(x), cy(y), 2.6 + Math.sin(time*6), 0, Math.PI*2); mctx.fill(); }
  }
  for (const c of crates) { mctx.fillStyle = c.type === 'ammo' ? '#4a4720' : '#ffd24a'; mctx.strokeStyle = '#c9a14a'; mctx.lineWidth = 1; mctx.fillRect(cx(c.x)-3, cy(c.y)-2.5, 6, 5); mctx.strokeRect(cx(c.x)-3, cy(c.y)-2.5, 6, 5); }
  if (bonus) { mctx.fillStyle = '#e8a317'; mctx.beginPath(); mctx.arc(cx(bonus.x), cy(bonus.y), 3, 0, Math.PI*2); mctx.fill(); }
  for (const b of bullets) { mctx.fillStyle = '#ffe08a'; mctx.fillRect(cx(b.x)-1, cy(b.y)-1, 2, 2); }
  for (const e of enemies) {
    if (e.mode === 'dead') continue;
    const ep = pos(e);
    mctx.fillStyle = e.mode === 'fright' ? FRIGHT_COLOR : ENEMY_COLORS[e.kind];
    mctx.strokeStyle = '#2f2a22'; mctx.lineWidth = 1;
    mctx.beginPath(); mctx.arc(cx(ep.x), cy(ep.y), 3.6, 0, Math.PI*2); mctx.fill(); mctx.stroke();
  }
  const pp = playerPos(), a = view === 'fp' ? Math.atan2(Math.cos(player.yaw), Math.sin(player.yaw)) : Math.atan2(player.face.y, player.face.x);
  mctx.save(); mctx.translate(cx(pp.x), cy(pp.y)); mctx.rotate(a);
  mctx.fillStyle = '#ffffff'; mctx.strokeStyle = '#2f2a22'; mctx.lineWidth = 1.5;
  mctx.beginPath(); mctx.moveTo(6, 0); mctx.lineTo(-4, 4.5); mctx.lineTo(-2, 0); mctx.lineTo(-4, -4.5); mctx.closePath();
  mctx.fill(); mctx.stroke();
  mctx.restore();
}

// ---------- HUD ----------
const $ = id => document.getElementById(id);
const overlay = $('overlay');
let lastOverlay = '';
function hud() {
  if (score > hi) hi = score;
  $('score').textContent = score; $('hi').textContent = hi; $('level').textContent = level;
  $('lives').textContent = '♥'.repeat(Math.max(0, lives)) + '♡'.repeat(Math.max(0, MAX_HEARTS - lives));
  const n = ammoOf[weapon];
  $('wname').textContent = WEAPONS[weapon].name.toUpperCase();
  $('ammo').textContent = n === Infinity ? '∞' : n; $('ammo').classList.toggle('empty', n === 0);
  let html = '';
  if (state === 'title') html = '<div class="big">LUCIOLE</div><div class="small">Espace ou une flèche pour jouer</div>';
  else if (state === 'ready') html = `<div class="big">Niveau ${level}</div><div class="small">Prêt ?</div>`;
  else if (state === 'over') html = `<div class="big">Dévoré !</div><div class="small">Score ${score} · Espace pour rejouer</div>`;
  else if (state === 'clear') html = '<div class="big">Bravo !</div>';
  else if (paused) html = '<div class="big">Pause</div><div class="small">P pour reprendre</div>';
  if (html !== lastOverlay) { overlay.innerHTML = html; lastOverlay = html; }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(1/30, (now - last)/1000); last = now;
  update(dt); render(now/1000, dt); hud();
  requestAnimationFrame(frame);
}

// ================= Contrôles =================
const KEYS = {
  ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1],
  q:[-1,0], a:[-1,0], d:[1,0], z:[0,-1], w:[0,-1], s:[0,1],
  tL:[-1,0], tR:[1,0], tU:[0,-1], tD:[0,1],   // glissements tactiles
};
const held = [];                              // touches de direction maintenues (vue 1re personne)
function press(k, repeat) {
  initAudio();
  if (canStart()) newGame();
  const v = KEYS[k];
  if (view !== 'fp') { player.want = { x:v[0], y:v[1] }; return; }
  if (!held.includes(k)) held.push(k);
  if (!repeat && v[1] === 1 && !player.spin) player.spin = Math.PI;   // ↓ : demi-tour fluide
}
function release(k) { const i = held.indexOf(k); if (i >= 0) held.splice(i, 1); }
const canStart = () => state === 'title' || state === 'over';
function fireOrStart() { initAudio(); if (canStart()) newGame(); else shoot(); }
addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (KEYS[k] && k.length > 2 || 'qadzws'.includes(k) && k.length === 1) { e.preventDefault(); press(k, e.repeat); return; }
  if (k === ' ' || k === 'f') { e.preventDefault(); if (!e.repeat) { fireOrStart(); fireHeld = true; } }
  else if (k === 'Enter') { initAudio(); if (canStart()) newGame(); else paused = !paused; }
  else if (k === 'p' || k === 'Escape') { if (!canStart()) paused = !paused; }
  else if (k === 'm') muted = !muted;
  else if (k === 'e') cycleWeapon();
  else if (k === '1' || k === '&') setWeapon('rifle');
  else if (k === '2' || k === 'é') setWeapon('glock');
  else if (k === '3' || k === '"') setWeapon('minigun');
  else if (k === '4' || k === "'") setWeapon('bazooka');
  else if (k === '5' || k === '(' || k === 'k') setWeapon('katana');
  else if (k === 'v' || k === 'c') setView(view === 'fp' ? 'top' : 'fp');
});
addEventListener('keyup', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k === ' ' || k === 'f') fireHeld = false;
  release(k);
});
addEventListener('mouseup', e => { if (e.button === 0) fireHeld = false; });
addEventListener('blur', () => { held.length = 0; fireHeld = false; });
$('viewBtn').addEventListener('click', e => { e.currentTarget.blur(); setView(view === 'fp' ? 'top' : 'fp'); });
$('weaponBtn').addEventListener('click', e => { e.currentTarget.blur(); cycleWeapon(); });
stage.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  if (view === 'fp' && !canStart() && document.pointerLockElement !== stage) {
    try { const r = stage.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch (err) {}
  }
  fireOrStart(); fireHeld = !canStart();
});
addEventListener('mousemove', e => { if (view === 'fp' && document.pointerLockElement === stage && !paused) player.yaw -= e.movementX * 0.0028; });
let touch0 = null, touchKey = null;
stage.addEventListener('touchstart', e => { const t = e.touches[0]; touch0 = { x:t.clientX, y:t.clientY }; touchKey = null; e.preventDefault(); }, { passive:false });
stage.addEventListener('touchmove', e => {
  if (!touch0 || touchKey) return;
  const t = e.touches[0], dx = t.clientX - touch0.x, dy = t.clientY - touch0.y;
  if (Math.hypot(dx, dy) < 24) return;
  touchKey = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'tR' : 'tL') : (dy > 0 ? 'tD' : 'tU');
  press(touchKey, false);
  e.preventDefault();
}, { passive:false });
stage.addEventListener('touchend', e => {
  if (!touch0) return;
  if (touchKey) release(touchKey); else fireOrStart();
  touch0 = null; touchKey = null;
}, { passive:false });

resetActors(); resetGrid(); resize(); setView('top'); hud();
requestAnimationFrame(frame);
</script>
